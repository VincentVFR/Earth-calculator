name: Publish GlobePath math alpha
run-name: Publish math ${{ inputs.version }} from ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact prerelease version to publish
        required: true
        default: 0.1.0-alpha.1
        type: string
permissions: {}
concurrency:
  group: globepath-math-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/earth-release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: refs/tags/v0.1.0-alpha.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@vincentvfr'
      - name: Verify version and math models
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./packages/math/package.json'); if(p.version!==process.env.EXPECTED_VERSION || !/^0\.1\.0-alpha\.[1-9]\d*$/.test(p.version)) throw Error('Unexpected prerelease version')"
          npm test
          npm run build:package
          mkdir -p artifacts
          npm pack ./build/math --pack-destination artifacts --ignore-scripts
          node scripts/smoke-package.cjs artifacts/vincentvfr-globepath-math-${EXPECTED_VERSION}.tgz
      - name: Publish alpha to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.1.0-alpha.1 --repo VincentVFR/Earth-calculator --pattern vincentvfr-globepath-math-0.1.0-alpha.1.tgz --dir artifacts --clobber
          echo '248268dcf454df62df136e9c9329295ec42c7da074c037dd46f7fdef78a4ed8e  artifacts/vincentvfr-globepath-math-0.1.0-alpha.1.tgz' | sha256sum --check
          mkdir -p build/release-package
          tar -xzf artifacts/vincentvfr-globepath-math-0.1.0-alpha.1.tgz -C build/release-package
          diff -r build/math build/release-package/package
          npm publish ./artifacts/vincentvfr-globepath-math-${PACKAGE_VERSION}.tgz --tag alpha --ignore-scripts
      - name: Verify published package and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api users/VincentVFR/packages/npm/globepath-math > "$RUNNER_TEMP/package-metadata.json"
          node <<'NODE'
          const p=require(process.env.RUNNER_TEMP+'/package-metadata.json');
          const repo=p.repository;
          console.log(JSON.stringify({packageMetadata:{name:p.name,visibility:p.visibility,html_url:p.html_url,repository:repo&&{full_name:repo.full_name,name:repo.name,id:repo.id,html_url:repo.html_url,private:repo.private}}}));
          NODE
          node <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const response=await fetch('https://npm.pkg.github.com/@vincentvfr%2Fglobepath-math',{headers:{Authorization:'Bearer '+process.env.NODE_AUTH_TOKEN,Accept:'application/json'}});
            console.log(JSON.stringify({registryResponse:{status:response.status}}));
            assert(response.ok,'Registry request failed with HTTP '+response.status);
            const p=await response.json();
            const v=p.versions?.['0.1.0-alpha.1'];
            console.log(JSON.stringify({publishedPackage:{name:p.name,version:v?.version,gitHead:v?.gitHead,integrity:v?.dist?.integrity,shasum:v?.dist?.shasum},distTags:p['dist-tags']}));
            assert(v,'Published version is absent');
            assert.equal(v.dist.integrity,'sha512-LJiYDiQuhBe36qDpFVeNUaIUaAXE0JQUqlw3ldWBCejVRL7j6KRoUR064P4s4VDwcquvhQc4zIEsUJqzWSgVfw==');
            assert.equal(v.dist.shasum,'4ebea52622b30239e410690f8788a84e1fed5729');
            assert.deepEqual(p['dist-tags'],{alpha:'0.1.0-alpha.1'});
            const metadata=require(process.env.RUNNER_TEMP+'/package-metadata.json');
            const repo=metadata.repository;
            assert(repo?.id===1132503122 || repo?.html_url?.toLowerCase()==='https://github.com/vincentvfr/earth-calculator','Unexpected linked repository');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
          install_dir=$(mktemp -d)
          npm install --prefix "$install_dir" @vincentvfr/globepath-math@0.1.0-alpha.1 --ignore-scripts --no-audit --no-fund --package-lock=false
          node scripts/smoke-package.cjs --installed "$install_dir"
