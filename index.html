<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobePath - Calculateur de Distance Orthodromique</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>

    <!-- Turf.js -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.0.0/turf.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* Glassmorphism effect */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Autocomplete dropdown */
        .autocomplete-results {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            margin-top: 0.25rem;
        }

        .autocomplete-item {
            padding: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            transition: background 0.2s;
        }

        .autocomplete-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        /* Loading spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Sidebar Panel -->
    <div class="absolute top-6 left-6 z-10 glass rounded-2xl p-6 w-80 text-white">
        <h1 class="text-2xl font-bold mb-2">🌍 GlobePath</h1>
        <p class="text-sm text-gray-200 mb-6">Visualisez le chemin le plus court sur le globe</p>

        <!-- Departure Input -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">📍 Départ</label>
            <div class="relative">
                <input
                    type="text"
                    id="departure"
                    placeholder="Ex: Paris, France"
                    class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-gray-300"
                    autocomplete="off"
                >
                <div id="departure-results" class="autocomplete-results hidden absolute w-full z-20"></div>
            </div>
        </div>

        <!-- Destination Input -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">🎯 Destination</label>
            <div class="relative">
                <input
                    type="text"
                    id="destination"
                    placeholder="Ex: Tokyo, Japan"
                    class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-gray-300"
                    autocomplete="off"
                >
                <div id="destination-results" class="autocomplete-results hidden absolute w-full z-20"></div>
            </div>
        </div>

        <!-- Calculate Button -->
        <button
            id="calculate-btn"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2"
        >
            <span>✈️ Calculer le trajet</span>
        </button>

        <!-- Info Box -->
        <div class="mt-4 p-4 bg-white/10 rounded-lg text-xs text-gray-200">
            💡 <strong>Astuce :</strong> Le trajet affiché est le chemin le plus court sur une sphère (orthodromie), différent d'une ligne droite sur une carte plate.
        </div>
    </div>

    <!-- Distance Badge -->
    <div id="distance-badge" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 glass-dark rounded-full px-6 py-3 text-white font-semibold hidden">
        <span id="distance-text">0 km</span>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="absolute top-6 right-6 z-10 glass-dark rounded-lg px-4 py-3 text-white hidden">
        <div class="flex items-center gap-3">
            <div class="spinner"></div>
            <span>Calcul en cours...</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
